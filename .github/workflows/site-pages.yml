name: Public site

# Publishes site/ (privacy policy and account-deletion page) to GitHub Pages.
# Enable once in Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish unfilled placeholders
        run: |
          if grep -n '<mark>\[' site/*.html || grep -n '\[email kontak\]' site/*.html; then
            echo "Fill every [placeholder] in site/ before publishing." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
