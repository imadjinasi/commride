name: Mobile CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Reject tracked provider or signing secrets
        run: |
          tracked="$(git ls-files --             'android/app/google-services.json'             'ios/Runner/GoogleService-Info.plist'             'android/key.properties'             'android/app/*.jks'             'android/app/*.keystore')"
          test -z "$tracked" || {
            echo "Forbidden provider/signing files are tracked:"
            echo "$tracked"
            exit 1
          }

      - name: Generate native platform projects
        run: |
          native_dir="$RUNNER_TEMP/commride_native"
          flutter create \
            --platforms=android,ios \
            --project-name commride_mobile \
            --org io.github.imadjinasi \
            "$native_dir"
          cp -R "$native_dir/android" "$native_dir/ios" .
          python tool/configure_platforms.py
          python tool/verify_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define=COMMRIDE_API_BASE_URL=https://example.invalid \
            --dart-define=COMMRIDE_MAPS_ENABLED=false

      - name: Build Android release AAB
        run: |
          flutter build appbundle --release \
            --dart-define=COMMRIDE_ENV=production \
            --dart-define=COMMRIDE_API_BASE_URL=https://example.invalid \
            --dart-define=COMMRIDE_MAPS_ENABLED=false

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commride-android-ci
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
