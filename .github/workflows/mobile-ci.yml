name: Mobile CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate native platform projects
        run: |
          flutter create --platforms=android,ios --project-name commride_mobile --org io.github.imadjinasi .
          python tool/configure_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define=COMMRIDE_API_BASE_URL=https://example.invalid \
            --dart-define=COMMRIDE_MAPS_ENABLED=false
