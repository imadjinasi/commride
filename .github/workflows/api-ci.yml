name: API CI

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate migrations
        if: ${{ hashFiles('services/api/migrations/*.sql') != '' }}
        run: python3 scripts/validate_migrations.py

      - name: Validate Worker deployment bundle
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/commride-worker"
